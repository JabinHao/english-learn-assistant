spring:
  datasource:
    url: ${AILEARN_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ailearn}
    username: ${AILEARN_DATASOURCE_USERNAME:ailearn}
    password: ${AILEARN_DATASOURCE_PASSWORD:ailearn}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

langchain4j:
  open-ai:
    chat-model:
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      api-key: sk-674270a2db9643c49c8e1b338e056dc2
      model-name: ${OPENAI_CHAT_MODEL:qwen3.6-flash-2026-04-16}
      temperature: 0.2

ailearn:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
  candidate:
    cron: ${AILEARN_CANDIDATE_CRON:0 32 0 * * *}
    lookback-hours: ${AILEARN_CANDIDATE_LOOKBACK_HOURS:36}
    max-candidates: ${AILEARN_CANDIDATE_MAX:5}
    min-score: ${AILEARN_CANDIDATE_MIN_SCORE:6.5}
  rss:
    feeds:
      - name: Hacker News AI
        url: https://hnrss.org/newest?q=%22artificial+intelligence%22+OR+llm+OR+agent
      - name: TechCrunch AI
        url: https://techcrunch.com/category/artificial-intelligence/feed/
      - name: OpenAI Blog
        url: https://openai.com/news/rss.xml
  filters:
    min-text-length: ${AILEARN_FILTERS_MIN_TEXT_LENGTH:120}
    keywords:
      - ai
      - llm
      - agent
      - model
      - inference
      - rag
      - vector
      - multimodal
      - reasoning
      - openai
  eudic:
    base-url: ${AILEARN_EUDIC_BASE_URL:https://api.frdic.com}
    auth-token: ${AILEARN_EUDIC_AUTH_TOKEN:}
    study-list-name: ${AILEARN_EUDIC_STUDY_LIST_NAME:ai-learn}
    language: ${AILEARN_EUDIC_LANGUAGE:en}

server:
  port: ${PORT:8080}
